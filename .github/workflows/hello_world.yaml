name: Deployment Pipeline

on: 
  push:
    branches:
        - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs: 
  deployment-pipeline:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Setup Node.js environment
          uses: actions/setup-node@v7
          with: 
            node-version: '24'
        
        - name: Install dependencies
          run: npm install

        - name: Lint
          run: npm run eslint

        - name: Test
          run: npm run test

        - name: Build
          run: npm run build

        



